"Mario" = ["m"]
"Luigi" = ["l"]
"DK" = ["Donkey Kong"]
"Diddy" = ["dy", "Diddy Kong"]
"Peach" = ["p"]
"Daisy" = ["d"]
"Yoshi" = ["y"]
"Baby Mario" = ["bym", "bmario"]
"Baby Luigi" = ["byl", "bluigi"]
"Bowser" = ["bw"]
"Wario" = ["w"]
"Waluigi" = ["wl", "walu"]
"Koopa(G)" = ["gk", "greg"]
"Toad(R)" = ["rt"]
"Boo" = ["b"]
"Toadette" = ["te"]
"Shy Guy(R)" = ["rsg"]
"Birdo" = ["bi", "bo", "bd"]
"Monty" = ["my", "mn", "Monty Mole", "moonball"]
"Bowser Jr" = ["bj", "Bowser Junior"]
"Paratroopa(R)" = ["rpt"]
"Pianta(B)" = ["bp"]
"Pianta(R)" = ["pm", "rp"]
"Pianta(Y)" = ["yp"]
"Noki(B)" = ["bn"]
"Noki(R)" = ["rn"]
"Noki(G)" = ["gn"]
"Bro(H)" = ["hb"]
"Toadsworth" = ["tw", "sworth"]
"Toad(B)" = ["bt", "teardrop"]
"Toad(Y)" = ["yt", "cornpop"]
"Toad(G)" = ["gt", "John Deere"]
"Toad(P)" = ["pt", "Lean Toad", "lean"]
"Magikoopa(B)" = ["bm"]
"Magikoopa(R)" = ["rm"]
"Magikoopa(G)" = ["gm"]
"Magikoopa(Y)" = ["ym", "pisswizard"]
"King Boo" = ["kb"]
"Petey" = ["py", "Petey Piranha"]
"Dixie" = ["dx", "dix", "Dixie Kong"]
"Goomba" = ["g"]
"Paragoomba" = ["pg"]
"Koopa(R)" = ["rk", "rkt", "ron"]
"Paratroopa(G)" = ["gpt"]
"Shy Guy(B)" = ["bsg"]
"Shy Guy(Y)" = ["ysg"]
