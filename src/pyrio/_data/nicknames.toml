# What people type for characters and stadiums, read by Character.parse,
# CharacterFamily.parse and Stadium.parse.
#
# Names are matched after folding case and dropping spaces and punctuation, so
# "Bowser Jr.", "bowser-jr" and "BOWSERJR" are the same name. Labels and the
# forms below are generated, so don't list them here:
#
#   - every canonical label ("Toad(B)") and family name ("Toad");
#   - for each variant, its suffix and words before or after each family stem:
#     "btoad", "toadb", "bluetoad", "toadblue" (and "r!toad", "toad (red)", ...).
#
# A name may mean only one thing. tests/test_characters.py fails on a clash, on
# a name that a rule already generates, and on a family with no default.

# Words for each variant suffix. A family can replace them with its own.
[variant_words]
R = ["red"]
B = ["blue"]
Y = ["yellow"]
G = ["green"]
P = ["purple"]
Bk = ["black"]
Gy = ["grey", "gray"]

# Families with variants. `default` is what the bare family name means
# (decided 2026-11-21). `nicknames` are other names for the family, and variant
# forms are built on them too ("mag" gives "bluemag", "magb", "bmag", ...).
[families.Koopa]
default = "Koopa(R)"

[families.Toad]
default = "Toad(R)"

[families."Shy Guy"]
default = "Shy Guy(R)"

[families.Paratroopa]
default = "Paratroopa(G)"
nicknames = ["para"]

[families.Pianta]
default = "Pianta(R)"

[families.Noki]
default = "Noki(G)"

[families.Bro]
default = "Bro(H)"
variant_words = { H = ["hammer"], F = ["fire"], B = ["boomerang"] }

[families.Magikoopa]
default = "Magikoopa(B)"
nicknames = ["mag"]

[families."Dry Bones"]
default = "Dry Bones(G)"
nicknames = ["bones"]

# Codes and nicknames, keyed by canonical label.
