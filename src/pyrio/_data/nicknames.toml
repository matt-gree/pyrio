# Shorthand for stadiums, keyed by canonical label. Labels and the older
# names in Stadium's aliases ("Bowser's Castle") are matched already.
[stadiums]
"Mario Stadium" = ["ms", "mario"]
"Bowser Castle" = ["bc", "bowser"]
"Wario Palace" = ["wp", "wario"]
"Yoshi Park" = ["yp", "yoshi"]
"Peach Garden" = ["pg", "peach"]
"DK Jungle" = ["dkj", "dk", "jungle"]
"Toy Field" = ["tf", "toy"]
