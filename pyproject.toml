[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "projectrio"
version = "1.0.0"
description = "Project Rio for Python: Mario Superstar Baseball stat files, game data and the Rio web API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MattGree", email = "MattGreeMSSB@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
# The core needs only the standard library; each job's dependency is an extra.
dependencies = []

[project.optional-dependencies]
web = ["httpx>=0.27"]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
all = ["projectrio[web,pandas,plot]"]

[project.scripts]
pyrio = "pyrio.__main__:main"

[project.urls]
Repository = "https://github.com/matt-gree/pyrio"
Issues = "https://github.com/matt-gree/pyrio/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.15",
    "pyright>=1.1.400",
    "import-linter>=2.1",
    "build>=1.2",
    "twine>=6",
    # What the extras' tests and type checks need.
    "httpx>=0.27",
    "pandas>=2.0",
    "pandas-stubs>=2.2",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.sdist]
include = ["src/pyrio", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrio"]

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pyrio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# --- ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# The Markdown is prose; its code blocks sketch APIs, so ruff leaves them alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming (section 7b)
    "A",        # builtins shadowed by names (section 7b: `kind`, not `type`)
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",
    "RET",
    "PT",       # pytest style
    "TC",       # imports used only for typing
    "PTH",      # pathlib over os.path
    "RUF",
]
# TC006 wants the type in cast() quoted, which buys nothing under PEP 563.
ignore = ["TC006"]

[tool.ruff.lint.isort]
known-first-party = ["pyrio"]

# --- pyright -----------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools", "examples"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

# --- import-linter -----------------------------------------------------------
# The layering from docs/v1.0.0-audit.md, section 7.

[tool.importlinter]
root_package = "pyrio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core layers"
type = "layers"
layers = [
    "pyrio._decode | pyrio._serialize | pyrio._run_values",
    "pyrio._game",
    "pyrio._stats | pyrio._team_names",
    "pyrio._codes : pyrio._characters : pyrio._names",
    "pyrio._enum",
    "pyrio._errors | pyrio._float32",
]

[[tool.importlinter.contracts]]
name = "Public submodules sit above the core, and the core imports none of them"
type = "layers"
layers = [
    "pyrio.web | pyrio.plot | pyrio.pandas | pyrio.ratings",
    "pyrio.svg | pyrio.sim",
    "pyrio.geometry",
    "pyrio._errors : pyrio._float32 : pyrio._enum : pyrio._codes : pyrio._characters : pyrio._names : pyrio._stats : pyrio._team_names : pyrio._game : pyrio._decode : pyrio._serialize : pyrio._run_values",
]

[[tool.importlinter.contracts]]
name = "The core, geometry, sim, svg and ratings need only the standard library"
type = "forbidden"
source_modules = [
    "pyrio.__main__",
    "pyrio._characters",
    "pyrio._codes",
    "pyrio._decode",
    "pyrio._enum",
    "pyrio._errors",
    "pyrio._float32",
    "pyrio._game",
    "pyrio._names",
    "pyrio._run_values",
    "pyrio._serialize",
    "pyrio._stats",
    "pyrio._team_names",
    "pyrio.geometry",
    "pyrio.ratings",
    "pyrio.sim",
    "pyrio.svg",
]
forbidden_modules = ["httpx", "matplotlib", "pandas"]

[[tool.importlinter.contracts]]
name = "pyrio.web is a leaf: nothing outside it imports it"
type = "protected"
protected_modules = ["pyrio.web"]
allowed_importers = ["pyrio.web"]

[[tool.importlinter.contracts]]
name = "Only pyrio.web imports httpx"
type = "protected"
protected_modules = ["httpx"]
allowed_importers = ["pyrio.web"]

[[tool.importlinter.contracts]]
name = "Only pyrio.pandas imports pandas"
type = "protected"
protected_modules = ["pandas"]
allowed_importers = ["pyrio.pandas"]

[[tool.importlinter.contracts]]
name = "Only pyrio.plot imports matplotlib"
type = "protected"
protected_modules = ["matplotlib"]
allowed_importers = ["pyrio.plot"]
