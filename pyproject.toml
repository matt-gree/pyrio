[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "projectrio"
version = "1.0.0.dev0"
description = "Project Rio for Python: Mario Superstar Baseball stat files, game data and the Rio web API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MattGree", email = "MattGreeMSSB@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    # Transitional: `import pyrio` loads rio_web, which needs requests. Step 7 of
    # docs/v1.0.0-audit.md deletes rio_web, and this list becomes empty.
    "requests>=2.29",
]

[project.optional-dependencies]
web = ["httpx>=0.27"]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
all = ["projectrio[web,pandas,plot]"]

[project.scripts]
pyrio = "pyrio.__main__:main"

[project.urls]
Repository = "https://github.com/matt-gree/pyrio"
Issues = "https://github.com/matt-gree/pyrio/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.15",
    "pyright>=1.1.400",
    "import-linter>=2.1",
    "build>=1.2",
    "twine>=6",
    { include-group = "legacy" },
]
# Transitional: what the pre-1.0 modules and their tests import. Step 7 deletes
# those modules and this group with them.
legacy = [
    "matplotlib>=3.7",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
]

[tool.hatch.build.targets.sdist]
include = ["src/pyrio", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrio"]

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pyrio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# --- ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Pre-1.0 code that the 1.0 rebuild ports or deletes (docs/v1.0.0-audit.md,
# section 9). A file leaves this list when a step rewrites it; never add one.
# Keep in step with [tool.pyright] exclude.
extend-exclude = [
    "src/pyrio/__init__.py",
    "src/pyrio/api.py",
    "src/pyrio/constants",
    "src/pyrio/draw",
    "src/pyrio/exceptions.py",
    "src/pyrio/glicko2.py",
    "src/pyrio/glicko_calculator.py",
    "src/pyrio/helpers.py",
    "src/pyrio/hit_analysis.py",
    "src/pyrio/hit_simulation.py",
    "src/pyrio/live_ball.py",
    "src/pyrio/rio_value.py",
    "src/pyrio/rio_web.py",
    "src/pyrio/stadiums.py",
    "src/pyrio/stat_file",
    "src/pyrio/stat_file_parser.py",
    "src/pyrio/stat_formatters.py",
    "src/pyrio/team_name_algo.py",
    "src/pyrio/web_caching.py",
    "tests/test_character_data.py",
    "tests/test_draw_stadium.py",
    "tests/test_event_search.py",
    "tests/test_hit_simulation.py",
    "tests/test_hud.py",
    "tests/test_live_ball.py",
    "tests/test_lookup_values.py",
    "tests/test_stadiums.py",
    "tests/test_stat_parser.py",
    "tests/test_team_name.py",
    "tools/compare_stadium_walls.py",
    "tools/derive_stadium_walls.py",
    "examples/game_summary.py",
]

[tool.ruff.format]
# The Markdown is prose; its code blocks sketch APIs, so ruff leaves them alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming (section 7b)
    "A",        # builtins shadowed by names (section 7b: `kind`, not `type`)
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",
    "RET",
    "PT",       # pytest style
    "TC",       # imports used only for typing
    "PTH",      # pathlib over os.path
    "RUF",
]
# TC006 wants the type in cast() quoted, which buys nothing under PEP 563.
ignore = ["TC006"]

[tool.ruff.lint.isort]
known-first-party = ["pyrio"]

# --- pyright -----------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools", "examples"]
# The pre-1.0 code (see [tool.ruff] extend-exclude, which this list mirrors).
exclude = [
    "**/__pycache__",
    "src/pyrio/__init__.py",
    "src/pyrio/api.py",
    "src/pyrio/constants",
    "src/pyrio/draw",
    "src/pyrio/exceptions.py",
    "src/pyrio/glicko2.py",
    "src/pyrio/glicko_calculator.py",
    "src/pyrio/helpers.py",
    "src/pyrio/hit_analysis.py",
    "src/pyrio/hit_simulation.py",
    "src/pyrio/live_ball.py",
    "src/pyrio/rio_value.py",
    "src/pyrio/rio_web.py",
    "src/pyrio/stadiums.py",
    "src/pyrio/stat_file",
    "src/pyrio/stat_file_parser.py",
    "src/pyrio/stat_formatters.py",
    "src/pyrio/team_name_algo.py",
    "src/pyrio/web_caching.py",
    "tests/test_character_data.py",
    "tests/test_draw_stadium.py",
    "tests/test_event_search.py",
    "tests/test_hit_simulation.py",
    "tests/test_hud.py",
    "tests/test_live_ball.py",
    "tests/test_lookup_values.py",
    "tests/test_stadiums.py",
    "tests/test_stat_parser.py",
    "tests/test_team_name.py",
    "tools/compare_stadium_walls.py",
    "tools/derive_stadium_walls.py",
    "examples/game_summary.py",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

# --- import-linter -----------------------------------------------------------
# The layering from docs/v1.0.0-audit.md, section 7. A layer in parentheses is
# optional, so a contract can name a module before the step that writes it.
# Contracts that need a module to exist (forbidden, independence) arrive with
# the step that writes the module: pyrio.web's isolation comes in step 5.

[tool.importlinter]
root_package = "pyrio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core layers"
type = "layers"
layers = [
    "(pyrio._decode) | (pyrio._serialize)",
    "(pyrio._game)",
    "(pyrio._stats) | (pyrio._team_names)",
    "(pyrio._codes) : (pyrio._characters) : (pyrio._names)",
    "(pyrio._enum)",
    "(pyrio._errors)",
]

[[tool.importlinter.contracts]]
name = "Public submodules sit above the core, and the core imports none of them"
type = "layers"
layers = [
    "(pyrio.web) | (pyrio.plot) | (pyrio.pandas) | (pyrio.ratings)",
    "(pyrio.svg) | (pyrio.sim)",
    "(pyrio.geometry)",
    "(pyrio._errors) : (pyrio._enum) : (pyrio._codes) : (pyrio._characters) : (pyrio._names) : (pyrio._stats) : (pyrio._team_names) : (pyrio._game) : (pyrio._decode) : (pyrio._serialize)",
]

[[tool.importlinter.contracts]]
name = "The core needs only the standard library, and none of the pre-1.0 modules"
type = "forbidden"
# A forbidden contract needs its modules to exist, so each step adds the core
# modules it writes here.
source_modules = [
    "pyrio.__main__",
    "pyrio._characters",
    "pyrio._codes",
    "pyrio._decode",
    "pyrio._enum",
    "pyrio._errors",
    "pyrio._game",
    "pyrio._names",
    "pyrio._serialize",
    "pyrio._stats",
    "pyrio._team_names",
]
forbidden_modules = [
    "httpx",
    "matplotlib",
    "numpy",
    "pandas",
    "requests",
    "scipy",
    "pyrio.api",
    "pyrio.constants",
    "pyrio.exceptions",
    "pyrio.rio_value",
    "pyrio.rio_web",
    "pyrio.stat_file",
    "pyrio.stat_file_parser",
    "pyrio.team_name_algo",
]

[[tool.importlinter.contracts]]
name = "pyrio.web is a leaf: nothing outside it imports it"
type = "protected"
protected_modules = ["pyrio.web"]
allowed_importers = ["pyrio.web"]

[[tool.importlinter.contracts]]
name = "Only pyrio.web imports httpx"
type = "protected"
protected_modules = ["httpx"]
allowed_importers = ["pyrio.web"]

[[tool.importlinter.contracts]]
name = "Geometry and sim need only the standard library and the core"
type = "forbidden"
source_modules = ["pyrio.geometry", "pyrio.sim"]
forbidden_modules = [
    "httpx",
    "matplotlib",
    "numpy",
    "pandas",
    "requests",
    "scipy",
    "pyrio.api",
    "pyrio.constants",
    "pyrio.exceptions",
    "pyrio.helpers",
    "pyrio.hit_analysis",
    "pyrio.hit_simulation",
    "pyrio.live_ball",
    "pyrio.rio_value",
    "pyrio.rio_web",
    "pyrio.stadiums",
    "pyrio.stat_file",
    "pyrio.stat_file_parser",
    "pyrio.team_name_algo",
]
